<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta name="referrer" content="no-referrer">
  <title>rokz.me</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #08080a;
      overflow: hidden;
    }

    body {
      position: relative;
      display: grid;
      place-items: center;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }

    /* soft ambient glow */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 700px 500px at 50% 42%, rgba(120,130,255,0.10), transparent 60%),
        radial-gradient(ellipse 500px 400px at 65% 60%, rgba(255,140,120,0.06), transparent 60%);
      pointer-events: none;
    }

    /* cursor-following light — painted above the text, brightens whatever it crosses */
    .cursor-light {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      mix-blend-mode: screen;
      background: radial-gradient(
        circle 110px at var(--x, 50%) var(--y, 50%),
        rgba(200, 205, 255, 0.45),
        rgba(200, 205, 255, 0.08) 45%,
        transparent 70%
      );
    }

    /* faint grid, tech-adjacent but calm */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 60% 50% at 50% 45%, black, transparent 75%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 24px;
      animation: rise 1.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #3a3a3f;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #7c8cff;
      box-shadow: 0 0 8px 1px rgba(124,140,255,0.6);
      animation: pulse 2.6s ease-in-out infinite;
    }

    .headline {
      margin: 0;
      font-size: clamp(1.6rem, 4.5vw, 2.4rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      background: linear-gradient(180deg, #8f8d84, #4c4a44);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subline {
      margin: 16px 0 0;
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      letter-spacing: 0.02em;
      color: #454549;
    }

    .rule {
      width: 36px;
      height: 1px;
      margin: 34px auto 0;
      background: linear-gradient(90deg, transparent, #3a3a3f, transparent);
    }

    .mark {
      margin: 20px 0 0;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 1.15rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #0a0a0c;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }

    @media (prefers-reduced-motion: reduce) {
      main, .dot { animation: none; }
    }
  </style>
</head>
<body>
  <div class="cursor-light" id="cursor-light"></div>
  <main>
    <div class="status"><span class="dot"></span>signal detected</div>
    <p class="headline">You're early.</p>
    <p class="subline">Nothing to see here yet.</p>
    <div class="rule"></div>
    <p class="mark">rokz.me</p>
  </main>
  <script>
    // Purely cosmetic: tracks pointer position locally to move a CSS glow.
    // No data is read, stored, sent, or shared — nothing leaves this page.
    (function () {
      var light = document.getElementById('cursor-light');
      window.addEventListener('pointermove', function (e) {
        light.style.setProperty('--x', e.clientX + 'px');
        light.style.setProperty('--y', e.clientY + 'px');
      });
    })();
  </script>
</body>
</html>
